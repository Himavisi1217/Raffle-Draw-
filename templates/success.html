{% extends "base.html" %} {% block title %}Registration Successful{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card card-glass shadow-lg border-0 text-center" style="position:relative;overflow:hidden">
      <!-- Confetti burst -->
      <div class="confetti-wrapper">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="card-body p-4 p-md-5" style="position:relative;z-index:1">
        <div class="success-icon mb-4">
          <span class="checkmark">✓</span>
        </div>
        <h1 class="h3 fw-semibold mb-3">
          <span class="text-gradient">Registration Successful</span>
        </h1>
        <p class="text-muted mb-4" style="max-width:360px;margin:0 auto">
          Thank you for registering! Your details have been securely saved and
          you are now in the pool for the random selection.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <span class="badge bg-secondary-soft">
            <i data-lucide="check-circle" style="width:12px;height:12px;margin-right:4px;vertical-align:-2px"></i>
            Confirmed
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
