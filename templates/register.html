{% extends "base.html" %} {% block title %}Register for {{ event.name }}{%
endblock %} {% block content %}
<div class="event-themed row justify-content-center" style="--event-accent: {{ event.accent_color or '#5FE0A5' }}">
  <div class="col-lg-6 col-md-8">
    <div class="card card-glass shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <div class="icon-header mb-3">
          <i data-lucide="user-check" style="width:24px;height:24px"></i>
        </div>
        <h1 class="h3 fw-semibold mb-2 text-center">Event Registration</h1>
        <p class="text-muted text-center mb-4">
          Registering for: <br />
          <strong class="text-gradient">{{ event.name }}</strong>
        </p>

        <form
          method="post"
          action="{{ url_for('register', event_id=event_id) }}"
          novalidate
        >
          {% for field in registration_fields %}
            {% if field.type == 'checkbox' %}
              <div class="form-check mb-4 consent-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="{{ field.key }}"
                  name="{{ field.key }}"
                  {% if field.required %}required{% endif %}
                />
                <label class="form-check-label small text-muted" for="{{ field.key }}">
                  {{ field.label }}
                </label>
              </div>
            {% else %}
              <div class="mb-3">
                <label for="{{ field.key }}" class="form-label">{{ field.label }}</label>
                <input
                  type="{{ field.type or 'text' }}"
                  class="form-control form-control-modern"
                  id="{{ field.key }}"
                  name="{{ field.key }}"
                  placeholder="{{ field.placeholder or '' }}"
                  {% if field.required %}required{% endif %}
                />
              </div>
            {% endif %}
          {% endfor %}

          <button type="submit" class="btn btn-primary w-100 btn-modern">
            <i data-lucide="send" style="width:16px;height:16px;margin-right:6px;vertical-align:-2px"></i>
            Submit Registration
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
