{% extends "base.html" %} {% block title %}Register for {{ event.name }}{%
endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card card-glass shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <div class="icon-header mb-3">
          <i data-lucide="user-check" style="width:24px;height:24px"></i>
        </div>
        <h1 class="h3 fw-semibold mb-2 text-center">Event Registration</h1>
        <p class="text-muted text-center mb-4">
          Registering for: <br />
          <strong class="text-gradient">{{ event.name }}</strong>
        </p>

        <form
          method="post"
          action="{{ url_for('register', event_id=event_id) }}"
          novalidate
        >
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control form-control-modern"
              id="name"
              name="name"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="mb-3">
            <label for="mobile_number" class="form-label">Mobile Number</label>
            <input
              type="tel"
              class="form-control form-control-modern"
              id="mobile_number"
              name="mobile_number"
              placeholder="+94 7X XXX XXXX"
              required
            />
          </div>

          <div class="mb-3">
            <label for="company_name" class="form-label">Company Name</label>
            <input
              type="text"
              class="form-control form-control-modern"
              id="company_name"
              name="company_name"
              placeholder="Acme Corp"
              required
            />
          </div>

          <div class="mb-3">
            <label for="position" class="form-label">Position</label>
            <input
              type="text"
              class="form-control form-control-modern"
              id="position"
              name="position"
              placeholder="Software Engineer"
              required
            />
          </div>

          <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control form-control-modern"
              id="email"
              name="email"
              placeholder="john@example.com"
              required
            />
          </div>

          <div class="form-check mb-4 consent-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="data_sharing_consent"
              name="data_sharing_consent"
              required
            />
            <label class="form-check-label small text-muted" for="data_sharing_consent">
              I agree that my registration data may be shared with the publishers
              for event-related communication and administration.
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-modern">
            <i data-lucide="send" style="width:16px;height:16px;margin-right:6px;vertical-align:-2px"></i>
            Submit Registration
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
